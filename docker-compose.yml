# Infra only. TODO(next): add api/worker/worker-render/client services as their Dockerfiles land.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: scraper
    ports: ["5433:5432"]  # 5433 on the host: 5432 is often taken by a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible store for raw HTML. MinIO stopped publishing public images, so this uses
  # adobe/s3mock: any access key works, the bucket is created at startup, and there is no
  # lifecycle expiry (add one with a real S3 store in production).
  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: scraper-html
    ports: ["9000:9090"]
    volumes: [s3data:/s3mockroot]

volumes:
  pgdata:
  s3data:
